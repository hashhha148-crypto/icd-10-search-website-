<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICD-10 Volume 3 Quick Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --ink: #0f172a;
      --muted: #475569;
      --line: #cbd5e1;
      --teal: #0f766e;
      --teal-dark: #115e59;
      --teal-soft: #ccfbf1;
      --amber-soft: #fef3c7;
      --amber-ink: #92400e;
      --radius: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'IBM Plex Sans Thai', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--teal);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .brand span {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .wrap {
      max-width: 1040px;
      margin: 20px auto 64px;
      padding: 0 16px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 760px) {
      .controls {
        grid-template-columns: 1.6fr 1fr auto;
      }
    }

    input[type="search"], select {
      width: 100%;
      padding: 10px 13px;
      font-size: 0.95rem;
      font-family: inherit;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-alt);
      color: var(--ink);
      outline: none;
    }

    input[type="search"]:focus, select:focus {
      background: var(--surface);
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .btn {
      padding: 10px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--surface-alt);
    }

    .btn-primary {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--teal-dark);
    }

    .quick-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      font-size: 0.88rem;
      color: var(--muted);
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-alt);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
    }

    .chip.active {
      background: var(--teal-soft);
      border-color: var(--teal);
      color: var(--teal-dark);
      font-weight: 600;
    }

    .list-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .row-item {
      padding: 14px 18px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row-item:last-child {
      border-bottom: none;
    }

    .row-item:hover {
      background: #f8fafc;
    }

    .row-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .term-path {
      font-weight: 600;
      font-size: 1rem;
      color: var(--ink);
      flex: 1 1 320px;
    }

    .arrow {
      color: #94a3b8;
      margin: 0 5px;
    }

    .code-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .code-pill {
      background: var(--teal-soft);
      color: var(--teal-dark);
      border: 1px solid #99f6e4;
      padding: 3px 9px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .code-pill:hover {
      filter: brightness(0.96);
    }

    .row-sub {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .mini-tag {
      font-size: 0.78rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: #f1f5f9;
      color: var(--muted);
    }

    .mini-tag.flag {
      background: var(--amber-soft);
      color: var(--amber-ink);
      font-weight: 600;
    }

    .row-note {
      font-size: 0.86rem;
      color: var(--muted);
      background: var(--surface-alt);
      padding: 8px 10px;
      border-radius: 6px;
    }

    .footer-action {
      margin-top: 16px;
      text-align: center;
    }

    .notice {
      margin-top: 24px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--amber-soft);
      color: var(--amber-ink);
      font-size: 0.84rem;
      text-align: center;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>ICD-10 Volume 3 Index</h1>
        <span>Alphabetical Lookup</span>
      </div>
      <div id="statusText">กำลังโหลดข้อมูล...</div>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="controls">
        <input
          id="searchInput"
          type="search"
          placeholder="ค้นหาคำศัพท์ รหัสโรค หรือคำพ้อง (พิมพ์หลายคำสลับลำดับได้)..."
          autocomplete="off"
        />
        <select id="sectionFilter">
          <option value="ALL">ทุกหมวด / ทุกบท (All Chapters)</option>
          <option value="Ch1">Chapter I (A00-B99)</option>
          <option value="Ch2">Chapter II (C00-D48)</option>
          <option value="Ch3">Chapter III (D50-D89)</option>
          <option value="Ch4">Chapter IV (E00-E90)</option>
          <option value="Ch5">Chapter V (F00-F99)</option>
          <option value="Ch6">Chapter VI (G00-G99)</option>
          <option value="Ch7">Chapter VII (H00-H59)</option>
          <option value="Ch8">Chapter VIII (H60-H95)</option>
          <option value="Ch9">Chapter IX (I00-I99)</option>
          <option value="Ch10">Chapter X (J00-J99)</option>
          <option value="Ch11">Chapter XI (K00-K93)</option>
          <option value="Ch12">Chapter XII (L00-L99)</option>
          <option value="Ch13">Chapter XIII (M00-M99)</option>
          <option value="Ch14">Chapter XIV (N00-N99)</option>
          <option value="Ch15">Chapter XV (O00-O99)</option>
          <option value="Ch16">Chapter XVI (P00-P96)</option>
          <option value="Ch17">Chapter XVII (Q00-Q99)</option>
          <option value="Ch18">Chapter XVIII (R00-R99)</option>
          <option value="Ch19">Chapter XIX (S00-T98)</option>
          <option value="Ch20">Chapter XX (V01-Y98)</option>
          <option value="Ch21">Chapter XXI (Z00-Z99)</option>
          <option value="Ch22">Chapter XXII (U00-U85)</option>
        </select>
        <button id="resetBtn" class="btn" type="button">ล้างค่า</button>
      </div>

      <div class="quick-filters">
        <div class="chip-group">
          <button class="chip active" data-flag="ALL" type="button">ทั้งหมด</button>
          <button class="chip" data-flag="NEC" type="button">เฉพาะ NEC</button>
          <button class="chip" data-flag="PAIR" type="button">รหัสคู่ (†/*)</button>
        </div>
        <span>แตะที่รหัสเพื่อคัดลอก</span>
      </div>
    </section>

    <section id="results" class="list-box"></section>
    <div id="loadMoreWrap" class="footer-action"></div>

    <div class="notice">
      <strong>หมายเหตุ:</strong> ข้อมูลอ้างอิงจาก ICD-10 Volume 3 (Alphabetical Index) ควรตรวจสอบเงื่อนไขรวม/ยกเว้นใน Volume 1 ก่อนลงรหัสจริง
    </div>
  </main>

  <div id="toast" class="toast">คัดลอกรหัสแล้ว</div>

  <script>
    const PAGE_SIZE = 60;
    let allItems = [];
    let currentFiltered = [];
    let visibleCount = PAGE_SIZE;
    let activeFlag = "ALL";

    const searchInput = document.getElementById("searchInput");
    const sectionFilter = document.getElementById("sectionFilter");
    const resetBtn = document.getElementById("resetBtn");
    const resultsEl = document.getElementById("results");
    const loadMoreWrap = document.getElementById("loadMoreWrap");
    const statusText = document.getElementById("statusText");
    const toastEl = document.getElementById("toast");

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toastEl.classList.remove("show"), 1600);
    }

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function inferSectionFromCodes(codes = []) {
      for (const raw of codes) {
        const m = String(raw).toUpperCase().match(/\b([A-Z])(\d{2})/);
        if (!m) continue;
        const letter = m[1];
        const num = parseInt(m[2], 10);

        if (letter === "A" || letter === "B") return "Ch1";
        if (letter === "C" || (letter === "D" && num <= 48)) return "Ch2";
        if (letter === "D" && num >= 50 && num <= 89) return "Ch3";
        if (letter === "E") return "Ch4";
        if (letter === "F") return "Ch5";
        if (letter === "G") return "Ch6";
        if (letter === "H" && num <= 59) return "Ch7";
        if (letter === "H" && num >= 60) return "Ch8";
        if (letter === "I") return "Ch9";
        if (letter === "J") return "Ch10";
        if (letter === "K") return "Ch11";
        if (letter === "L") return "Ch12";
        if (letter === "M") return "Ch13";
        if (letter === "N") return "Ch14";
        if (letter === "O") return "Ch15";
        if (letter === "P") return "Ch16";
        if (letter === "Q") return "Ch17";
        if (letter === "R") return "Ch18";
        if (letter === "S" || letter === "T") return "Ch19";
        if (["V", "W", "X", "Y"].includes(letter)) return "Ch20";
        if (letter === "Z") return "Ch21";
        if (letter === "U") return "Ch22";
      }
      return "";
    }

    function normalizeItem(raw) {
      const codes = Array.isArray(raw.codes)
        ? raw.codes
        : (raw.code ? [raw.code] : []);
      const section = raw.section || inferSectionFromCodes(codes);

      const searchable = [
        raw.lead_term,
        ...(Array.isArray(raw.modifiers) ? raw.modifiers : []),
        raw.full_text,
        ...codes,
        raw.cross_reference,
        raw.tabular_note
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      return {
        ...raw,
        codes,
        section,
        _searchable: searchable
      };
    }

    function renderList() {
      const slice = currentFiltered.slice(0, visibleCount);
      const totalMatched = currentFiltered.length;

      statusText.textContent =
        `แสดง ${slice.length} / ${totalMatched.toLocaleString()} รายการ (รวม ${allItems.length.toLocaleString()})`;

      if (totalMatched === 0) {
        resultsEl.innerHTML = `<div class="row-item">ไม่พบรายการที่ตรงกับเงื่อนไขการค้นหา</div>`;
        loadMoreWrap.innerHTML = "";
        return;
      }

      resultsEl.innerHTML = slice.map((item) => {
        const parts = [item.lead_term, ...(item.modifiers || [])].filter(Boolean);
        const titleHtml = parts
          .map((p, i) => `${i > 0 ? '<span class="arrow">/</span>' : ''}${escapeHtml(p)}`)
          .join("");

        const codesHtml = (item.codes || [])
          .map((c) => `<button type="button" class="code-pill" data-copy="${escapeHtml(c)}">${escapeHtml(c)}</button>`)
          .join("");

        const tags = [
          item.section ? `<span class="mini-tag">${escapeHtml(item.section)}</span>` : "",
          item.page ? `<span class="mini-tag">หน้า ${escapeHtml(item.page)}</span>` : "",
          item.nec ? `<span class="mini-tag flag">NEC</span>` : "",
          item.dagger_star ? `<span class="mini-tag flag">†/*</span>` : "",
          item.cross_reference ? `<span class="mini-tag flag">${escapeHtml(item.cross_reference)}</span>` : ""
        ].filter(Boolean).join("");

        return `
          <div class="row-item">
            <div class="row-main">
              <div class="term-path">${titleHtml || escapeHtml(item.full_text || "")}</div>
              <div class="code-group">${codesHtml}</div>
            </div>
            ${tags ? `<div class="row-sub">${tags}</div>` : ""}
            ${item.tabular_note ? `<div class="row-note">${escapeHtml(item.tabular_note)}</div>` : ""}
          </div>
        `;
      }).join("");

      resultsEl.querySelectorAll(".code-pill").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const code = btn.getAttribute("data-copy");
          try {
            await navigator.clipboard.writeText(code);
            showToast(`คัดลอกรหัส ${code} แล้ว`);
          } catch {
            showToast(`รหัส: ${code}`);
          }
        });
      });

      if (visibleCount < totalMatched) {
        const remaining = totalMatched - visibleCount;
        loadMoreWrap.innerHTML = `
          <button id="loadMoreBtn" class="btn btn-primary" type="button">
            โหลดเพิ่มอีก ${Math.min(PAGE_SIZE, remaining)} รายการ (เหลือ ${remaining.toLocaleString()} รายการ)
          </button>
        `;
        document.getElementById("loadMoreBtn").addEventListener("click", () => {
          visibleCount += PAGE_SIZE;
          renderList();
        });
      } else {
        loadMoreWrap.innerHTML = "";
      }
    }

    function filterData() {
      const q = searchInput.value.trim().toLowerCase();
      const sec = sectionFilter.value;
      const tokens = q ? q.split(/\s+/) : [];

      visibleCount = PAGE_SIZE;

      currentFiltered = allItems.filter((item) => {
        if (sec !== "ALL" && item.section !== sec) return false;
        if (activeFlag === "NEC" && !item.nec) return false;
        if (activeFlag === "PAIR" && !item.dagger_star) return false;
        if (tokens.length === 0) return true;
        return tokens.every((t) => item._searchable.includes(t));
      });

      renderList();
    }

    async function fetchJsonSafe(url) {
      try {
        const res = await fetch(url);
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data) ? data : (data.items || []);
      } catch {
        return [];
      }
    }

    async function loadDataset() {
      const cleanedItems = await fetchJsonSafe("./data/icd10_vol3_cleaned.json");
      if (cleanedItems.length > 0) return cleanedItems;

      const directItems = await fetchJsonSafe("https://hashhha148-crypto.github.io/ICD-10-/icd10_vol3_cleaned.json");
      if (directItems.length > 0) return directItems;

      const singleItems = await fetchJsonSafe("./data/volume3_index.json");
      if (singleItems.length > 0) return singleItems;

      const letters = "abcdefghijklmnopqrstuvwxyz".split("");
      const urls = [
        ...letters.map((ch) => `./data/index_${ch}.json`),
        "./data/index_other.json"
      ];
      const fetchedLists = await Promise.all(urls.map(fetchJsonSafe));
      const merged = fetchedLists.flat();
      if (merged.length > 0) return merged;

      const fallbackItems = await fetchJsonSafe("./data/sample_index.json");
      if (fallbackItems.length > 0) return fallbackItems;

      throw new Error("ไม่พบไฟล์ข้อมูลที่ใช้งานได้");
    }

    async function init() {
      try {
        const rawList = await loadDataset();
        allItems = rawList.map(normalizeItem);
        filterData();
      } catch (err) {
        statusText.textContent = "โหลดข้อมูลไม่สำเร็จ";
        resultsEl.innerHTML = `<div class="row-item">เกิดข้อผิดพลาด: ${escapeHtml(err.message)}</div>`;
      }
    }

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        activeFlag = chip.getAttribute("data-flag");
        filterData();
      });
    });

    searchInput.addEventListener("input", filterData);
    sectionFilter.addEventListener("change", filterData);
    resetBtn.addEventListener("click", () => {
      searchInput.value = "";
      sectionFilter.value = "ALL";
      activeFlag = "ALL";
      document.querySelectorAll(".chip").forEach((c) => {
        c.classList.toggle("active", c.getAttribute("data-flag") === "ALL");
      });
      filterData();
    });

    init();
  </script>
</body>
</html>
